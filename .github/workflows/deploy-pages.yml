name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Select deployment mode
        shell: bash
        env:
          AUTH_ENABLED: ${{ vars.VITE_AUTH_ENABLED }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ "$AUTH_ENABLED" == "true" ]]; then
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
              echo "VITE_AUTH_ENABLED=true requires VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY." >&2
              exit 1
            fi
            echo "VITE_DEMO_MODE=false" >> "$GITHUB_ENV"
            echo "Authenticated deployment selected."
          else
            echo "VITE_DEMO_MODE=true" >> "$GITHUB_ENV"
            echo "Demo deployment selected. Set VITE_AUTH_ENABLED=true after configuring Supabase and Google OAuth."
          fi

      - name: Build TELOS
        run: pnpm build
        env:
          VITE_DEMO_MODE: ${{ env.VITE_DEMO_MODE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
